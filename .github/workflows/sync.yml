name: Sync TDesktop Releases

on:
  schedule:
    - cron: "0 17 * * *"   # 每天北京时间凌晨 1 点执行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        uses: pozetroninc/github-action-get-latest-release@v1
        with:
          repository: telegramdesktop/tdesktop

      - name: Show upstream version
        run: echo "Latest version is ${{ steps.upstream.outputs.release }}"

      - name: Check if already exists in our repo
        id: check
        run: |
          TAG="${{ steps.upstream.outputs.release }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Exit if version exists
        if: steps.check.outputs.exists == 'true'
        run: echo "Already synced."

      - name: Download assets
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir release
          gh release download "${{ steps.upstream.outputs.release }}" \
            -R telegramdesktop/tdesktop -D release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release to this repo
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.upstream.outputs.release }}"
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --notes "Synced from Telegram Desktop official release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
