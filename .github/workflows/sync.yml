name: Sync TDesktop Releases

on:
  schedule:
    - cron: "0 17 * * *"  # 每天北京时间凌晨1点
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST=$(curl -s https://api.github.com/repos/telegramdesktop/tdesktop/releases/latest | jq -r .tag_name)
          echo "release=$LATEST" >> $GITHUB_OUTPUT

      - name: Check if already exists in our repo
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.release }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if exists
        if: steps.check.outputs.exists == 'true'
        run: echo "Already synced."

      - name: Download assets
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release
          gh release download "${{ steps.upstream.outputs.release }}" \
            -R telegramdesktop/tdesktop -D release

      - name: Publish to our repo
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.release }}"
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --notes "Synced from Telegram Desktop official release."
